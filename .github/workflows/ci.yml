name: CI

on:
  push:
  pull_request:

# Cancel an older run of the same branch/PR when a new commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # CI has no GPU and no Ollama. Tests use the fakes in test/mocks/ollama.ts.
  # Pointing at an unused port makes any accidental real call fail loudly
  # instead of silently depending on a local model.
  OLLAMA_HOST: http://127.0.0.1:11435

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22        # project needs >= 20.9
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build


  # OPTIONAL: smoke eval. Replays saved model outputs (no model, no images, no
  # network) to check that the metric code still produces the expected numbers.
